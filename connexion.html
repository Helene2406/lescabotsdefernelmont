<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Les Cabots de Fernelmont</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="app-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><img src="assets/logo.png" alt="Logo Les Cabots de Fernelmont"></div>
    <h1>Espace club</h1>
    <p class="login-sub">Connexion membres &amp; administration</p>

    <div class="login-error" id="loginError">Identifiant ou mot de passe incorrect.</div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="identifiant">Identifiant</label>
        <input type="text" id="identifiant" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="motdepasse">Mot de passe</label>
        <div class="field-input-row">
          <input type="password" id="motdepasse" name="password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw">Afficher</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Se connecter</button>
    </form>

    <p style="text-align:center; margin-top:18px;">
      <a href="index.html" style="color: var(--slate); font-size: 0.85rem; text-decoration: underline;">← Retour au site</a>
    </p>
  </div>
</div>

<script type="module">
  import { auth, signInWithEmailAndPassword, onAuthStateChanged, identifiantVersEmail, db, doc, getDoc }
    from "./assets/firebase-config.js";

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const pwInput = document.getElementById('motdepasse');
  const togglePw = document.getElementById('togglePw');

  togglePw.addEventListener('click', () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    togglePw.textContent = isPw ? 'Masquer' : 'Afficher';
  });

  // Se souvenir du dernier identifiant utilisé (jamais du mot de passe)
  const savedUser = localStorage.getItem('cabots_dernier_identifiant');
  if (savedUser) document.getElementById('identifiant').value = savedUser;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion...';

    let identifiant = document.getElementById('identifiant').value.trim();
    // Le premier caractère doit être en majuscule
    identifiant = identifiant.charAt(0).toUpperCase() + identifiant.slice(1);
    const motdepasse = pwInput.value;

    try {
      const email = identifiantVersEmail(identifiant);
      const cred = await signInWithEmailAndPassword(auth, email, motdepasse);
      localStorage.setItem('cabots_dernier_identifiant', identifiant);

      const membreDoc = await getDoc(doc(db, 'membres', cred.user.uid));
      if (!membreDoc.exists()) {
        errorBox.textContent = "Compte non configuré. UID recherché : " + cred.user.uid;
        console.log("UID recherché dans Firestore (collection membres) :", cred.user.uid);
        errorBox.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Se connecter';
        return;
      }
      const role = membreDoc.data().role;
      window.location.href = role === 'admin' ? 'admin.html' : 'espace-membre.html';
    } catch (err) {
      errorBox.textContent = "Identifiant ou mot de passe incorrect.";
      errorBox.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Se connecter';
    }
  });
</script>
</body>
</html>
